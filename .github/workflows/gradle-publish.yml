name: Java CI with Gradle

on:
  push:
    branches: [ main, testng, junit4 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Setup JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
    - name: Build and test with Gradle
      run: ./gradlew clean test
